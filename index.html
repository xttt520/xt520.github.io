            --blue: #a5d8ff;
            --text: #5b4a5c;
            --card-bg: rgba(255, 250, 252, 0.85);
            --shadow: 0 8px 24px rgba(255, 182, 193, 0.2);
            --radius: 24px;
            --font: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font);
            background: linear-gradient(135deg, #fdeff2 0%, #eef6ff 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text);
            background-image: radial-gradient(circle, rgba(255,192,203,0.3) 1px, transparent 1px),
                              radial-gradient(circle, rgba(165,216,255,0.3) 1.5px, transparent 1.5px);
            background-size: 30px 30px, 50px 50px;
        }
        .header {
            text-align: center; padding: 30px 20px 10px;
            backdrop-filter: blur(6px); background: rgba(255,245,248,0.6);
            border-bottom: 2px dashed #ffb3c6;
        }
        .header h1 { font-size: 2.5rem; color: #d45d79; }
        .header h1::before { content: "🍒 "; }
        .header h1::after { content: " 🍒"; }
        .subtitle { color: #b98b9a; margin-top: 6px; font-weight: 600; }

        .tab-nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 16px 0 0 0;
        }
        .tab-btn {
            padding: 10px 32px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            border: 2px dashed #ffc1cc;
            background: rgba(255,240,245,0.8);
            color: #8b6b7a;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }
        .tab-btn.active {
            background: #ffb3c6;
            color: white;
            border-color: #ff8da1;
            box-shadow: 0 4px 12px rgba(255,130,150,0.3);
        }
        .tab-btn:hover:not(.active) {
            background: #fff0f5;
            border-color: #ffb3c6;
            color: #d45d79;
        }

        .page-container { display: none; }
        .page-container.active { display: block; }

        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
        .filter-panel {
            background: var(--card-bg); backdrop-filter: blur(16px);
            border-radius: 30px; padding: 28px; margin-bottom: 32px;
            box-shadow: var(--shadow); border: 2px dashed #ffc1cc;
        }
        .filter-group { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }

        .filter-tags { display: flex; flex-wrap: wrap; gap: 10px; }

            padding: 8px 18px; border-radius: 30px; font-weight: 600;

        .filter-tag.active { background: #ffb3c6; color: white; border-color: #ff8da1; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 22px; }
        .card {
            background: var(--card-bg); backdrop-filter: blur(12px);
            border-radius: 18px; box-shadow: var(--shadow); border: 2px dashed #ffd1dc;
            transition: all 0.25s; display: flex; flex-direction: column;

        .card:hover { transform: translateY(-6px); border-color: #ffb3c6; }
        .card-header { padding: 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .avatar {
            width: 50px; height: 50px; border-radius: 50%;

            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 700; font-size: 1.4rem;
            box-shadow: 0 4px 12px rgba(255,182,193,0.35);
            border: 2px solid white;
            background-size: cover; background-position: center;
        }
        .card-name { font-weight: 700; color: #5b4a5c; }
        .card-body { padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 0.73rem; font-weight: 700; }
        .badge-pos { background: #e3f2ff; color: #3b7a9e; }
        .badge-gender { background: #ffe0ec; color: #c94b6c; }
        .badge-type { background: #fff0db; color: #b45f2a; }
        .badge-voice { background: #ede4ff; color: #6c5b9e; }
        .btn-detail {
            background: white; border: 2px solid #ffb3c6; color: #d45d79;
            padding: 7px 20px; border-radius: 25px; font-weight: 700; cursor: pointer;
        }
        .modal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(255,225,235,0.6); backdrop-filter: blur(8px);
            z-index: 1000; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-dialog {
            background: rgba(255,250,252,0.95); backdrop-filter: blur(20px);
            border-radius: 32px; max-width: 480px; width: 90%; padding: 28px;
            border: 2px dashed #ffc1cc;
        }
        .modal-close { position: absolute; top:14px; right:18px; border:none; background:none; font-size:1.8rem; color:#d45d79; cursor:pointer; }
        .modal-img-wrapper {
            position: relative; margin: 16px 0; cursor: pointer;
            border-radius: 20px; overflow: hidden; border: 2px dashed #ffb3c6;
        }
        .modal-img {
            width: 100%; height: 200px; background: #fce4ec;
            display: flex; align-items: center; justify-content: center;
            color: #d45d79; background-size: cover; background-position: center;
            transition: transform 0.2s;
        }
        .modal-img-wrapper:hover .modal-img { transform: scale(1.02); }
        .img-hint {
            position: absolute; bottom: 8px; right: 10px;
            background: rgba(0,0,0,0.5); color: white; font-size: 0.75rem;
            padding: 4px 10px; border-radius: 12px; pointer-events: none;
            backdrop-filter: blur(4px);
        }
        .audio-container { margin-bottom: 16px; }
        audio { width: 100%; border-radius: 10px; }
        .info-line { margin-bottom: 8px; white-space: pre-line; }
        .info-label { font-weight: 700; color: #d45d79; }
        .lightbox-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.85); z-index: 2000;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s; cursor: pointer;
        }
        .lightbox-overlay.active { opacity: 1; pointer-events: auto; }
        .lightbox-img {
            max-width: 90%; max-height: 90%; border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5); object-fit: contain;
        }
        .lightbox-close {
            position: absolute; top: 20px; right: 30px; font-size: 2.5rem;
            color: white; cursor: pointer; z-index: 2001; opacity: 0.8;
        }
        .lightbox-close:hover { opacity: 1; }
    </style>
</head>

                });
            }

            allTagsPeiwan.forEach(tag => tag.addEventListener('click', () => {
                const attr = tag.dataset.attr, val = tag.dataset.value;
                if (!activeFiltersPeiwan[attr]) return;
                const idx = activeFiltersPeiwan[attr].indexOf(val);
                idx > -1 ? activeFiltersPeiwan[attr].splice(idx,1) : activeFiltersPeiwan[attr].push(val);
                updateTagActivePeiwan(); renderCardsPeiwan();
            }));

            btnResetPeiwan.addEventListener('click', () => {
                for (let k in activeFiltersPeiwan) activeFiltersPeiwan[k] = [];
                updateTagActivePeiwan(); renderCardsPeiwan();
            });

            const activeFiltersKefu = { gender:[] };
            const cardsContainerKefu = document.getElementById('cards-container-kefu');
            const resultCountKefu = document.getElementById('result-count-kefu');
            const allTagsKefu = document.querySelectorAll('#page-kefu .filter-tag');
            const btnResetKefu = document.getElementById('btn-reset-kefu');

            function renderCardsKefu() {
                const filtered = companionsKefu.filter(c => {
                    if (activeFiltersKefu.gender.length && !activeFiltersKefu.gender.includes(c.gender)) return false;
                    return true;
                });
                resultCountKefu.textContent = filtered.length;
                if (!filtered.length) {
                    cardsContainerKefu.innerHTML = '<div style="text-align:center;padding:60px;color:#c9a9b5;">💁 没有匹配的客服</div>';
                    return;
                }
                cardsContainerKefu.innerHTML = filtered.map(c => {
                    const avatarStyle = c.avatarImg ? `background-image:url(${c.avatarImg});background-size:cover;` : '';
                    return `
                    <div class="card" data-type="kefu" data-id="${c.id}">
                        <div class="card-header" data-action="open-detail">
                            <div class="avatar" style="${avatarStyle}">${c.avatarImg ? '' : c.name.charAt(0)}</div>
                            <div>
                                <div class="card-name">${c.name}</div>
                                <div style="font-size:0.8rem;color:#b98b9a;">ID:${String(c.id).padStart(3,'0')}</div>
                            </div>
                        </div>
                        <div class="card-body">
                            <span class="badge badge-gender">${c.gender}</span>
                        </div>
                        <div style="padding:12px; text-align:right;">
                            <button class="btn-detail" data-action="open-detail">查看详情</button>
                        </div>
                    </div>`;
                }).join('');

                document.querySelectorAll('#page-kefu [data-action="open-detail"]').forEach(el => {
                    el.addEventListener('click', function(e) {
                        const card = this.closest('.card');
                        if (card) openDetail('kefu', parseInt(card.dataset.id));
                    });
                });
            }

            function updateTagActiveKefu() {
                allTagsKefu.forEach(tag => {
                    const attr = tag.dataset.attr, val = tag.dataset.value;
                    tag.classList.toggle('active', activeFiltersKefu[attr] && activeFiltersKefu[attr].includes(val));
                });
            }

            allTagsKefu.forEach(tag => tag.addEventListener('click', () => {
                const attr = tag.dataset.attr, val = tag.dataset.value;
                if (!activeFiltersKefu[attr]) return;
                const idx = activeFiltersKefu[attr].indexOf(val);
                idx > -1 ? activeFiltersKefu[attr].splice(idx,1) : activeFiltersKefu[attr].push(val);
                updateTagActiveKefu(); renderCardsKefu();
            }));

            btnResetKefu.addEventListener('click', () => {
                for (let k in activeFiltersKefu) activeFiltersKefu[k] = [];
                updateTagActiveKefu(); renderCardsKefu();
            });

            const modalOverlay = document.getElementById('modal-overlay');
            const modalClose = document.getElementById('modal-close');
            const audioPlayer = document.getElementById('audio-player');
            const modalAudio = document.getElementById('modal-audio');
            const lightboxOverlay = document.getElementById('lightbox-overlay');
            const lightboxImg = document.getElementById('lightbox-img');
            const lightboxClose = document.getElementById('lightbox-close');
            const imgHint = document.getElementById('img-hint');
            const imgWrapper = document.getElementById('modal-img-wrapper');
            let currentDetailImgUrl = '';

            function openDetail(type, id) {
                let c;
                if (type === 'peiwan') c = companionsPeiwan.find(x => x.id === id);
                else if (type === 'kefu') c = companionsKefu.find(x => x.id === id);
                if (!c) return;

                document.getElementById('modal-avatar').style.backgroundImage = c.avatarImg ? `url(${c.avatarImg})` : '';
                document.getElementById('modal-avatar').textContent = c.avatarImg ? '' : (c.avatar || c.name.charAt(0));
                document.getElementById('modal-name').textContent = c.name;

                let badgesHtml = '';
                if (type === 'peiwan') {
                    badgesHtml = c.position.map(p => `<span class="badge badge-pos">${p}</span>`).join('') +
                                 `<span class="badge badge-gender">${c.gender}</span>` +
                                 `<span class="badge badge-type">${c.type}</span>` +
                                 `<span class="badge badge-voice">${c.voice}</span>`;
                } else {
                    badgesHtml = `<span class="badge badge-gender">${c.gender}</span>`;
                }
                document.getElementById('modal-badges').innerHTML = badgesHtml;

                const imgDiv = document.getElementById('modal-image');
                if (type === 'kefu' && !c.detailImg) {
                    imgWrapper.style.display = 'none';
                } else {
                    imgWrapper.style.display = 'block';
                    if (c.detailImg) {
                        currentDetailImgUrl = c.detailImg;
                        imgDiv.style.backgroundImage = `url(${c.detailImg})`;
                        imgDiv.style.backgroundColor = '';
                        imgDiv.textContent = '';
                        imgHint.style.display = 'inline-block';
                    } else {
                        currentDetailImgUrl = '';
                        imgDiv.style.backgroundImage = '';
                        imgDiv.style.backgroundColor = c.imgColor || '#fce4ec';
                        imgDiv.textContent = '🍒 暂无展示图';
                        imgHint.style.display = 'none';
                    }
                }

                if (c.audioUrl && c.audioUrl.trim() !== '') {
                    audioPlayer.src = c.audioUrl;
                    modalAudio.style.display = 'block';
                } else {
                    audioPlayer.src = '';
                    modalAudio.style.display = 'none';
                }

                let descHtml = '';
                if (type === 'peiwan') {
                    descHtml = `
                        <div class="info-line"><span class="info-label">年龄：</span>${c.age}</div>
                        <div class="info-line"><span class="info-label">性格：</span>${c.personality}</div>
                        <div class="info-line"><span class="info-label">一句话形容：</span>${c.motto}</div>
                        <div class="info-line"><span class="info-label">其他技能：</span>${c.skill || '无'}</div>
                        <div class="info-line"><span class="info-label">在线时间：</span>${c.onlineTime}</div>
                    `;
                } else {
                    descHtml = `
                        <div class="info-line"><span class="info-label">详细介绍：</span>${c.desc || '暂无介绍'}</div>
                    `;
                }
                document.getElementById('modal-desc').innerHTML = descHtml;
                modalOverlay.classList.add('active');
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
                audioPlayer.pause();
                audioPlayer.src = '';
                imgWrapper.style.display = 'block';
            }

            function openLightbox() {
                if (!currentDetailImgUrl) return;
                lightboxImg.src = currentDetailImgUrl;
                lightboxOverlay.classList.add('active');
            }
            function closeLightbox() { lightboxOverlay.classList.remove('active'); }

            document.getElementById('modal-img-wrapper').addEventListener('click', function(e) {
                if (currentDetailImgUrl) openLightbox();
            });
            lightboxOverlay.addEventListener('click', function(e) {
                if (e.target === lightboxOverlay || e.target === lightboxClose) closeLightbox();
            });
            lightboxClose.addEventListener('click', closeLightbox);
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') {
                    if (lightboxOverlay.classList.contains('active')) closeLightbox();
                    else if (modalOverlay.classList.contains('active')) closeModal();
                }
            });

            modalClose.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });

            renderCardsPeiwan();
            updateTagActivePeiwan();
            renderCardsKefu();
            updateTagActiveKefu();
        })();
    </script>
</body>
</html>
